replicaCount: 1
nameOverride: ""
fullnameOverride: ""
image:
  repository: example-registry-quay-quay.apps.cluster-wf5q5.dyn.redhatworkshops.io/mike/mirror
  tag: "0.0.16"
  pullPolicy: Always
imagePullSecrets: []
service:
  type: ClusterIP
  port: 8080
route:
  enabled: true
  annotations: {}
  tls:
    termination: edge
resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 512Mi
env:
  otelExporterOtlpEndpoint: "http://localhost:4317"
  quarkusLogLevel: "INFO"
livenessProbe:
  httpGet:
    path: /q/health/live
    port: 8080
  initialDelaySeconds: 10
  periodSeconds: 10
readinessProbe:
  httpGet:
    path: /q/health/ready
    port: 8080
  initialDelaySeconds: 5
  periodSeconds: 5
